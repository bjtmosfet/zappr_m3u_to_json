name: Converti M3U in Zappr (Auto & Manuale)

on:
  workflow_dispatch:
    inputs:
      m3u_url:
        description: "URL Playlist (lascia vuoto per usare la variabile salvata)"
        required: false
        type: string

  schedule:
    # Aggiornamento automatico ogni giorno alle 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  download-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verifica URL ed Esegui Conversione
        env:
          INPUT_URL: ${{ inputs.m3u_url }}
          DEFAULT_URL: ${{ vars.DEFAULT_M3U_URL }}
        run: |
          # 1. Prova a prendere l'URL dall'input manuale
          URL="${INPUT_URL}"
          
          # 2. Se l'input è vuoto, usa la variabile di repository
          if [ -z "$URL" ]; then
            URL="${DEFAULT_URL}"
          fi

          # 3. Se ancora vuoto, esce senza errori per evitare mail di fallimento
          if [ -z "$URL" -o "$URL" = "null" ]; then
            echo "::notice:: Nessun URL M3U trovato. Operazione saltata con successo."
            exit 0
          fi

          # Salva la variabile per il passaggio dell'Artifact
          echo "M3U_URL=$URL" >> $GITHUB_ENV

          # Esegue lo script passando l'URL tramite il parametro --source
          python convert.py --source "$URL"

      - name: Carica il file JSON (Artifact)
        if: env.M3U_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: zappr-channels-json
          path: channels.json
          retention-days: 7
          
