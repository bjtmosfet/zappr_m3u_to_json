name: Converti M3U in Zappr (Auto & Manuale)

on:
  workflow_dispatch:
    inputs:
      m3u_url:
        description: "URL Playlist (lascia vuoto per usare il Secret)"
        required: false
        type: string

  schedule:
    # Aggiornamento automatico ogni giorno alle 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  download-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verifica URL ed Esegui Conversione
        env:
          INPUT_URL: ${{ inputs.m3u_url }}
          SECRET_URL: ${{ secrets.M3U_URL }}
        run: |
          # Seleziona l'URL dall'input manuale o dal Secret
          URL="${INPUT_URL}"
          if [ -z "$URL" ]; then
            URL="${SECRET_URL}"
          fi

          # Se l'URL è ancora vuoto, esce pulito con codice 0 (Nessun errore, nessuna mail)
          if [ -z "$URL" ]; then
            echo "::notice:: Nessun URL M3U trovato nei Secrets o negli Input. Operazione saltata con successo."
            exit 0
          fi

          # Se l'URL esiste, imposta la variabile ed esegui lo script Python
          echo "M3U_URL=$URL" >> $GITHUB_ENV
          python convert.py

      - name: Carica il file JSON (Artifact)
        if: env.M3U_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: zappr-channels-json
          path: channels.json
          retention-days: 7
          
